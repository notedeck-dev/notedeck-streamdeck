<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Post Note</title>
  <script src="sdpi-components.js"></script>
  <script src="pi.js"></script>
</head>
<body>
    <sdpi-item label="__MSG_apiUrl__"><sdpi-textfield setting="baseUrl" global placeholder="http://127.0.0.1:19820"></sdpi-textfield></sdpi-item>
    <sdpi-item label="__MSG_token__"><sdpi-password setting="token" global placeholder="__MSG_tokenHint__"></sdpi-password></sdpi-item>
    <sdpi-item><sdpi-button id="nd-test"><sdpi-i18n key="test"></sdpi-i18n></sdpi-button></sdpi-item>
    <sdpi-item label="__MSG_status__"><small id="nd-status"></small></sdpi-item>
    <sdpi-item label="__MSG_account__"><sdpi-select setting="accountId" datasource="accounts" show-refresh placeholder="__MSG_pick__"></sdpi-select></sdpi-item>
    <sdpi-item label="__MSG_accountId__"><sdpi-textfield setting="accountId" placeholder="__MSG_accountIdHint__"></sdpi-textfield></sdpi-item>
    <sdpi-item label="__MSG_text__"><sdpi-textarea setting="text" rows="4"></sdpi-textarea></sdpi-item>
    <sdpi-item label="__MSG_cw__"><sdpi-textfield setting="cw" placeholder="__MSG_optional__"></sdpi-textfield></sdpi-item>
    <sdpi-item label="__MSG_visibility__"><sdpi-select setting="visibility" default="public" data-legacy-specified><option value="public">__MSG_visPublic__</option><option value="home">__MSG_visHome__</option><option value="followers">__MSG_visFollowers__</option></sdpi-select></sdpi-item>
    <sdpi-item><small><sdpi-i18n key="postNote"></sdpi-i18n></small></sdpi-item>
</body>
</html>
