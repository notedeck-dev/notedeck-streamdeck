<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Open Post Form</title>
  <script src="sdpi-components.js"></script>
  <script src="pi.js"></script>
</head>
<body>
    <sdpi-item label="__MSG_text__"><sdpi-textarea setting="text" rows="3"></sdpi-textarea></sdpi-item>
    <sdpi-item label="__MSG_cw__"><sdpi-textfield setting="cw" placeholder="__MSG_optional__"></sdpi-textfield></sdpi-item>
    <sdpi-item label="__MSG_visibility__"><sdpi-select setting="visibility"><option value="">__MSG_visDefault__</option><option value="public">__MSG_visPublic__</option><option value="home">__MSG_visHome__</option><option value="followers">__MSG_visFollowers__</option><option value="specified">__MSG_visDirect__</option></sdpi-select></sdpi-item>
    <sdpi-item label="__MSG_status__"><small id="nd-status"></small></sdpi-item>
    <sdpi-item><small><sdpi-i18n key="composeNote"></sdpi-i18n></small></sdpi-item>
</body>
</html>
