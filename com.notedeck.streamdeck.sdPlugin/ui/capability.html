<!DOCTYPE html>
<html>
<head lang="en">
  <meta charset="utf-8" />
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <title>Run Capability</title>
    <sdpi-item label="NoteDeck API URL"><sdpi-textfield setting="baseUrl" global placeholder="http://127.0.0.1:19820"></sdpi-textfield></sdpi-item>
    <sdpi-item label="API token"><sdpi-password setting="token" global placeholder="Settings → Permissions → API tokens"></sdpi-password></sdpi-item>
    <sdpi-item label="Capability ID"><sdpi-textfield setting="capabilityId" placeholder="e.g. notes.create, app.hide, column.add"></sdpi-textfield></sdpi-item>
    <sdpi-item label="Params (JSON)"><sdpi-textarea setting="params" rows="5" placeholder="{ }"></sdpi-textarea></sdpi-item>
    <sdpi-item><small>Browse ids and parameters at http://127.0.0.1:19820/api/capabilities (with the token) or in NoteDeck's API docs column.</small></sdpi-item>
</body>
</html>
